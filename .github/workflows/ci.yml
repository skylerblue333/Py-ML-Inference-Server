name: inference-ci

on:
  push:
    branches:
      - main
      - "product/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Build container
        run: docker build -t sky-inference:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-inference:ci --format '{{.Config.User}}')" = "app"
      - name: Runtime smoke test
        run: |
          docker run -d --rm --name sky-inference-ci -p 18000:8000 sky-inference:ci
          trap 'docker stop sky-inference-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs sky-inference-ci
          exit 1
